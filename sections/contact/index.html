<section class="contact section" id="contact"><div><span class="eyebrow">START A CONVERSATION</span><h2>Good questions.<br>New possibilities.</h2><p>Have a research idea, a question about the app, or a business use case? Tell us what you’re exploring.</p></div><form id="contact-form"><div class="form-row"><label>Your name<input name="name" autocomplete="name" required maxlength="120" placeholder="Ada Lovelace"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@yourwork.com"></label></div><label>What’s on your mind?<textarea name="message" required minlength="10" maxlength="5000" rows="4" placeholder="A little about your project…"></textarea></label><button class="button dark" type="submit">Prepare message <span>↗</span></button><p class="form-note">Prepare a message to copy. Direct delivery will be available when the contact channel opens.</p><p class="form-status" role="status"></p><textarea id="prepared-message" aria-label="Prepared contact message" rows="6" hidden readonly></textarea></form></section>
